name: CI & Quantitative Benchmarks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies & package
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Run Pytest Invariant Suite
      env:
        PYTHONPATH: .
      run: |
        python -m pytest tests/ -v

    - name: Run Latency Benchmarks
      env:
        PYTHONPATH: .
      run: |
        python tests/benchmark.py

    - name: Validate SQL Minimum Viable
      run: python scripts/validate_sql_minimum_viable.py

    - name: Validate Terraform Minimum Viable
      run: python scripts/validate_terraform_minimum_viable.py

    - name: Validate No Internal Leaks
      run: python scripts/validate_no_internal_leaks.py
